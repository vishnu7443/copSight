version: '3.8'

services:
  backend:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./ksp_copsight.db
      - SECRET_KEY=KSP-SECRET-KEY-AI-OPS-2026-PRODUCTION-HASH
    volumes:
      - ../datasets:/app/datasets

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
